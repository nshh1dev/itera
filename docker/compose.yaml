# Ejecutar desde la raíz con --project-directory . para conservar el proyecto y sus volúmenes.
services:
  piston:
    image: ghcr.io/engineer-man/piston@sha256:2f66b7456189c4d713aa986d98eccd0b6ee16d26c7ec5f21b30e942756fd127a
    restart: unless-stopped
    privileged: true
    environment:
      PISTON_DISABLE_NETWORKING: "true"
      # Presupuesto del conductor TypeScript (compilación + ejecución).
      # El adaptador sigue pidiendo 3000 ms para Python/JavaScript y el
      # conductor limita a 3000 ms el programa del alumno en TypeScript.
      PISTON_RUN_TIMEOUT: "12000"
      PISTON_RUN_CPU_TIME: "10000"
      PISTON_COMPILE_TIMEOUT: "8000"
      PISTON_COMPILE_CPU_TIME: "8000"
      PISTON_RUN_MEMORY_LIMIT: "268435456"
      PISTON_COMPILE_MEMORY_LIMIT: "268435456"
      PISTON_OUTPUT_MAX_SIZE: "65536"
      PISTON_MAX_PROCESS_COUNT: "64"
      PISTON_MAX_OPEN_FILES: "2048"
      PISTON_MAX_FILE_SIZE: "10000000"
      PISTON_MAX_CONCURRENT_JOBS: "4"
    ports:
      - "127.0.0.1:2000:2000"
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec

volumes:
  piston-packages:

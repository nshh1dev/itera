services:
  piston:
    image: ghcr.io/engineer-man/piston:latest
    restart: unless-stopped
    privileged: true
    environment:
      PISTON_DISABLE_NETWORKING: "true"
      PISTON_RUN_TIMEOUT: "3000"
      PISTON_RUN_CPU_TIME: "3000"
      PISTON_RUN_MEMORY_LIMIT: "268435456"
      PISTON_COMPILE_MEMORY_LIMIT: "268435456"
      PISTON_OUTPUT_MAX_SIZE: "65536"
      PISTON_MAX_PROCESS_COUNT: "64"
      PISTON_MAX_CONCURRENT_JOBS: "4"
    ports:
      - "127.0.0.1:2000:2000"
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec

volumes:
  piston-packages:
